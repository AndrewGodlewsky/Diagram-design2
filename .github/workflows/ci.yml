          python scripts/test-verify-drawio-import.py

      - name: Verify Mermaid import script
        if: always()
        id: mermaid
        run: python scripts/verify-mermaid-import.py

      - name: Verify Excalidraw import script
        if: always()
        id: excalidraw
        run: |
          python scripts/verify-excalidraw-import.py
          python scripts/test-verify-excalidraw-import.py

      - name: Verify doctor diagnostics contract
        if: always()
        id: doctor
        run: python scripts/verify-doctor.py

      - name: Verify doctor diagnostics tests
        if: always()
        id: doctor_tests
        run: python scripts/test-verify-doctor.py

      - name: Verify docs and routing sync
        if: always()
        id: docs_sync
        shell: bash
        run: |
          python scripts/verify-docs-sync.py
          python scripts/test-verify-docs-sync.py

      - name: Verify packaged self-check
        if: always()
        id: self_check
        run: python scripts/test-self-check.py

      - name: Verify standalone SVG export (CSS carry + defs IDs)
        if: always()
        id: export_svg
        run: python scripts/test-export-svg-standalone.py

      - name: Verify label geometry
        if: always()
        id: geometry
        run: python scripts/verify-geometry.py --all

      - name: Verify label geometry checker
        if: always()
        id: geometry_tests
        run: python scripts/test-verify-geometry.py

      - name: Verify block registry
        if: always()
        id: block_registry
        run: python scripts/verify-block-registry.py --all

      - name: Verify block registry checker
        if: always()
        id: block_registry_tests
        run: python scripts/test-verify-block-registry.py

      - name: Verify treemap area fidelity and label fit
        if: always()
        id: treemap
        run: python scripts/verify-treemap.py --all

      - name: Verify treemap checker
        if: always()
        id: treemap_tests
        run: python scripts/test-verify-treemap.py

      - name: Verify marimekko width, height and area shares
        if: always()
        id: marimekko
