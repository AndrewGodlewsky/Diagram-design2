name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  plugin-package:
    name: Plugin Package & Version Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "core.autocrlf"
          GIT_CONFIG_VALUE_0: "false"
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test plugin package tooling
        run: python3 scripts/test-plugin-package.py

      - name: Verify maintainer policy tracks package and CI truth
        run: python3 scripts/test-maintainer-policy.py

      - name: Verify OpenAI plugin directory listing and upload ZIP
        run: python3 scripts/test-build-openai-plugin-zip.py

      # Versions are bumped on main by the Auto Version Bump workflow after
      # each merge (ADR 0009); pull requests must leave them untouched.
      # A pull_request checkout is GitHub's merge of the PR into the current
      # base tip, so the merge's first parent is the base to compare against.
      # github.event.pull_request.base.sha can predate later auto-bumps and
      # would report their versions as edits made by the PR.
      - name: Forbid manifest version changes in pull requests
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if ! git rev-parse -q --verify HEAD^2 >/dev/null; then
              echo "expected the pull request merge commit at HEAD" >&2
              exit 1
            fi
            python3 scripts/verify-plugin-package.py --require-no-bump HEAD^1
          else
            python3 scripts/verify-plugin-package.py --current-only
          fi

  validate:
    name: Lint & Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "core.autocrlf"
          GIT_CONFIG_VALUE_0: "false"
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify accessible SVG contract
        if: always()
        id: a11y
        run: python scripts/test-lint-a11y.py

      - name: Verify static local package boundary
        run: |
          python scripts/verify-local-static.py
          python scripts/test-verify-local-static.py
          python scripts/test-static-safety.py

      - name: Verify semantic pattern documentation
        if: always()
        id: semantic_docs
        run: python scripts/verify-semantic-motion.py --markdown-only

      - name: Verify URL SVG normalization
        if: always()
        id: url_icons
        run: python scripts/test-build-icons-quoted-attributes.py

      - name: Verify Devicon normalization
        if: always()
        id: devicon
        run: python scripts/test-build-icons-devicon.py

      - name: Verify mojibake repair utility
        if: always()
        id: mojibake
        run: python scripts/test-fix-mojibake.py

      - name: Verify skill HTML comments pass the Hermes install scan
        if: always()
        id: install_scan
        run: python scripts/test-install-scan.py

      - name: Run skin linter
        if: always()
        id: skin
        run: python scripts/lint-skin.py --all --baseline

      - name: Verify skin token contrast
        if: always()
        id: contrast
        shell: bash
        run: |
          python scripts/test-verify-contrast.py
          python scripts/verify-contrast.py

      - name: Verify quantitative polar chart
        if: always()
        id: polar
        shell: bash
        run: |
          python scripts/test-verify-polar.py
          python scripts/verify-polar.py

      - name: Verify heatmap monotone ramp and grid
        if: always()
        id: heatmap
        shell: bash
        run: |
          python scripts/test-verify-heatmap.py
          python scripts/verify-heatmap.py --all

      - name: Verify sequence OAuth specs
        if: always()
        id: oauth
        run: python scripts/verify-sequence-oauth.py

      - name: Verify semantic-motion verifier
        if: always()
        id: semantic_motion_tests
        run: python scripts/test-verify-semantic-motion.py

      - name: Verify sequence-oauth verifier
        if: always()
